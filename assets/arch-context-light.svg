  <rect x="460" y="130" width="180" height="50" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
  <text x="550" y="155" text-anchor="middle" dominant-baseline="central" fill="#0C447C" font-size="13">求值 ${dict}</text>


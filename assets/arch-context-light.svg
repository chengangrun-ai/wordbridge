  <text x="530" y="322" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A" font-size="13" font-weight="600">未命中 → 查词库 rice</text>
  <text x="530" y="341" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-size="11">原行为，不受影响</text>

  <text x="40" y="378" dominant-baseline="central" fill="#5F5E5A" font-size="12">改 4 个文件 237 行；只加一层查询，不动原有的词库路径。</text>
